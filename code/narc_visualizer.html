/<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NARC Visualizer</title>
<script>
  // Apply saved theme before paint to avoid a flash.
  (function () {
    try {
      var saved = localStorage.getItem("narc-visualizer-theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if ((saved || (prefersDark ? "dark" : "light")) === "light")
        document.documentElement.dataset.theme = "light";
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --link: #58a6ff;
    --accent: #238636;
    --accent-hover: #2ea043;
    --accent-glow: rgba(63,185,80,0.12);
    --masked-a: #1c2128;
    --masked-b: #21262d;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --panel: #f6f8fa;
    --panel2: #eef1f4;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #636e7b;
    --link: #0969da;
    --accent: #1a7f37;
    --accent-hover: #1f9c40;
    --accent-glow: rgba(26,127,55,0.08);
    --masked-a: #eef1f4;
    --masked-b: #e2e6ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    transition: background 0.2s, color 0.2s;
  }
  header {
    padding: 1.2rem 2rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .header-top { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  header h1 {
    margin: 0; font-size: 1.3rem; font-weight: 700;
    color: var(--accent); letter-spacing: 0.02em;
  }
  .header-controls { display: flex; align-items: center; gap: .6rem; margin-left: auto; flex-wrap: wrap; }
  select, input[type="text"] {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: .4rem .6rem;
    font-size: .85rem;
  }
  button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: .4rem .8rem; cursor: pointer; font-size: .82rem;
  }
  button:hover { border-color: var(--link); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .theme-toggle {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); cursor: pointer; padding: .4rem;
    display: flex; align-items: center; justify-content: center;
  }
  .theme-toggle svg { width: 15px; height: 15px; display: block; }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); }
  .meme-card {
    display: flex; align-items: center; gap: .5rem;
    border: 1px solid var(--border); border-radius: 8px; padding: .4rem .7rem;
    background: var(--panel); font-size: .82rem; font-weight: 600;
  }
  .meme-card .meme-emoji { font-size: 1.4rem; line-height: 1; }
  .meme-card button { padding: .2rem .45rem; font-size: .85rem; }

  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

  .narrative-block {
    background: var(--accent-glow); border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0; padding: 1rem 1.25rem; margin-bottom: 1.5rem;
    font-size: .9rem; line-height: 1.65;
  }
  .puzzle-title { font-size: 1.1rem; font-weight: 700; margin-bottom: .3rem; }
  .puzzle-sub { color: var(--muted); font-size: .78rem; margin-bottom: .5rem; }

  .section-label {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .1em;
    font-weight: 700; color: var(--accent); margin: 1.6rem 0 .7rem;
    padding-bottom: .35rem; border-bottom: 1px solid var(--border);
  }
  .section-label:first-of-type { margin-top: 0; }

  /* ── Custom load panel ── */
  #custom-panel { display: none; }
  #custom-panel textarea {
    width: 100%; min-height: 130px; resize: vertical;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: .78rem; padding: .7rem; margin-bottom: .6rem;
  }
  #custom-panel.drag-over textarea { border-color: var(--accent); background: var(--accent-glow); }
  .btn-row { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .5rem; align-items: center; }
  .drop-hint { font-size: .75rem; color: var(--muted); }
  .error-box {
    color: #f85149; background: rgba(248,81,73,0.08); border: 1px solid rgba(248,81,73,0.35);
    border-radius: 6px; padding: .5rem .75rem; font-size: .82rem; margin: .5rem 0; white-space: pre-wrap;
  }

  /* ── Settings bar ── */
  .settings-bar {
    display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: .7rem 1rem; margin-bottom: 1.2rem; font-size: .82rem;
  }
  .settings-bar .field { display: flex; align-items: center; gap: .5rem; }
  .settings-bar label { color: var(--muted); white-space: nowrap; }
  .chk { display: flex; align-items: center; gap: .35rem; cursor: pointer; color: var(--muted); }
  input[type="range"] { width: 100px; }
  .settings-bar .spacer { flex: 1; }
  .reveal-wrap { display: flex; align-items: center; gap: .6rem; }
  #celebrate-card { display: none; }
  #celebrate-card.show { display: flex; }

  /* ── Sequence ── */
  .sequence-wrap { overflow-x: auto; padding-bottom: .5rem; }
  .sequence-row { display: flex; gap: 1.1rem; padding-bottom: .25rem; width: max-content; }
  .frame-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: .8rem .9rem .9rem; display: flex; flex-direction: column;
    align-items: center; gap: .55rem; min-width: 0;
  }
  .frame-card.is-masked { border-color: var(--link); }
  .frame-label {
    font-family: ui-monospace, SFMono-Regular, monospace; font-size: .73rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .frame-label.masked-label { color: var(--link); }
  .grid-table { border-collapse: collapse; }
  .grid-table td { text-align: center; font-weight: 600; }

  .masked-placeholder {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 3px;
    background: repeating-linear-gradient(45deg, var(--masked-a), var(--masked-a) 4px, var(--masked-b) 4px, var(--masked-b) 8px);
  }
  .masked-q { font-size: 2rem; font-weight: 700; color: var(--link); opacity: .7; }

  /* ── Legend ── */
  .legend { display: flex; flex-wrap: wrap; gap: .4rem; }
  .legend-item { display: flex; align-items: center; gap: .3rem; font-size: .72rem; color: var(--muted); }
  .legend-swatch { width: 15px; height: 15px; border-radius: 3px; border: 1px solid var(--border); flex-shrink: 0; }
  a { color: var(--link); }
  code { background: var(--panel2); padding: .1rem .3rem; border-radius: 4px; font-size: .82em; }
</style>
</head>

    </div>

</header>

<main>
  <!-- ── Custom puzzle load panel ── -->
  <div id="custom-panel">
    <div class="section-label">Load custom NARC puzzle JSON</div>
    <textarea id="json-input" placeholder='Paste NARC JSON here (needs a "sequence" array)…' spellcheck="false"></textarea>
    <div class="btn-row">
      <button class="primary" id="load-custom-btn">Visualize</button>
      <button id="upload-btn" type="button">Upload .json</button>
      <input type="file" accept=".json,application/json" id="json-file" style="display:none">

  </div>

    <div class="narrative-block" id="narrative-text"></div>

    <div class="settings-bar">

      <label class="chk"><input type="checkbox" id="show-legend" checked> Color legend</label>

      <div class="reveal-wrap">

        <button class="primary" id="reveal-btn">Reveal Answers</button>
        <div class="meme-card" id="celebrate-card">
          <span class="meme-emoji" id="celebrate-emoji"></span>
          <span id="celebrate-caption"></span>
        </div>
      </div>
    </div>

    <div class="section-label">Sequence</div>
    <div class="sequence-wrap">
      <div class="sequence-row" id="sequence-row"></div>
    </div>

    <div class="section-label" id="legend-label">Color Legend</div>
    <div class="legend" id="color-legend"></div>
  </div>
</main>

// ── Persisted state ──
const STORE_KEY = "narc-visualizer-v1";
const state = {
  puzzleKey: "stump",
  cellSize: 32,
  showNumbers: true,
  showGrid: true,
  showLegend: true,
  memesEnabled: true,
  customJson: "",
};
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) Object.assign(state, JSON.parse(raw));
  } catch (e) {}
}

let puzzleData = null;   // normalized: {title,narrative,sequence,maskedSet,answerGrids,puzzle_id,creator,difficulty}
let answersShown = false;

// ── Normalize a raw NARC json blob into the shape the renderer wants ──
function normalizePuzzle(data) {
  if (!Array.isArray(data.sequence)) throw new Error('Not a valid NARC puzzle — missing a "sequence" array.');
  const maskedSet = new Set((data.masked_positions || []).map(Number));
  return {
    title: data.title || "(no title)",
    narrative: data.narrative || (Array.isArray(data.variants) && data.variants[0] && data.variants[0].narrative) || "(no narrative)",
    puzzle_id: data.puzzle_id || "—",
    creator: data.creator || "—",
    difficulty: data.difficulty || data.human_difficulty || data.ai_difficulty || "",
    sequence: data.sequence,
    maskedSet,
    answerGrids: data.answer_grids || {},
  };
}

function normalizeCell(v) {
  const n = parseInt(String(v), 10);
  return isNaN(n) ? 0 : Math.max(0, Math.min(9, n));
}

// ── Grid rendering ──
function renderGridTable(grid) {
  const cs = state.cellSize;
  const table = document.createElement("table");
  table.className = "grid-table";
  for (const row of grid) {
    const tr = document.createElement("tr");
    for (const val of row) {
      const idx = normalizeCell(val);
      const td = document.createElement("td");
      td.style.width = cs + "px";
      td.style.height = cs + "px";
      td.style.fontSize = Math.max(8, Math.round(cs * 0.34)) + "px";
      td.style.border = state.showGrid ? "1px solid var(--border)" : "1px solid transparent";
      td.style.background = ARC_COLORS[idx];
      td.style.color = DARK_IDX.has(idx) ? "#fff" : "#000";
      if (state.showNumbers) td.textContent = String(idx);
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  return table;
}

function renderMasked(rows, cols) {
  const cs = state.cellSize;
  const div = document.createElement("div");
  div.className = "masked-placeholder";
  div.style.width = (cols * cs) + "px";
  div.style.height = (rows * cs) + "px";
  const q = document.createElement("span");
  q.className = "masked-q";
  q.textContent = "?";
  div.appendChild(q);
  return div;
}

// ── Full puzzle render ──
function renderPuzzle() {
  if (!puzzleData) return;

  document.getElementById("ph-title").textContent = puzzleData.title;
  const bits = [`ID: ${puzzleData.puzzle_id}`, `Creator: ${puzzleData.creator}`];
  if (puzzleData.difficulty) bits.push(`Difficulty: ${puzzleData.difficulty}`);
  document.getElementById("ph-sub").textContent = bits.join("  ·  ");
  document.getElementById("narrative-text").textContent = puzzleData.narrative;

  const maskedCount = puzzleData.maskedSet.size;
  document.getElementById("masked-count").textContent =
    maskedCount ? `${maskedCount} masked frame${maskedCount > 1 ? "s" : ""}` : "No masked frames";
  document.getElementById("reveal-btn").style.display = maskedCount ? "" : "none";
  document.getElementById("reveal-btn").textContent = answersShown ? "Hide Answers" : "Reveal Answers";

  const row = document.getElementById("sequence-row");
  row.innerHTML = "";
  const seq = puzzleData.sequence.slice().sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
  for (const frame of seq) {
    const pos = frame.position;
    const isMasked = puzzleData.maskedSet.has(Number(pos)) || !!frame.masked;
    const card = document.createElement("div");
    card.className = "frame-card" + (isMasked ? " is-masked" : "");

    const lbl = document.createElement("div");
    lbl.className = "frame-label" + (isMasked ? " masked-label" : "");
    lbl.textContent = (frame.label || `#${pos}`) + (isMasked ? " (?)" : "");
    card.appendChild(lbl);

    const wrap = document.createElement("div");
    wrap.dataset.position = pos;
    if (isMasked) {
      if (answersShown && puzzleData.answerGrids[String(pos)]) {
        wrap.appendChild(renderGridTable(puzzleData.answerGrids[String(pos)]));
      } else {
        wrap.appendChild(renderMasked(frame.rows || 5, frame.cols || 5));
      }
    } else if (frame.grid) {
      wrap.appendChild(renderGridTable(frame.grid));
    } else {
      wrap.appendChild(renderMasked(frame.rows || 5, frame.cols || 5));
    }
    card.appendChild(wrap);
    row.appendChild(card);
  }

  document.getElementById("legend-label").style.display = state.showLegend ? "" : "none";
  const legend = document.getElementById("color-legend");
  legend.style.display = state.showLegend ? "" : "none";
  legend.innerHTML = "";
  if (state.showLegend) {
    for (let i = 0; i < 10; i++) {
      const item = document.createElement("div");
      item.className = "legend-item";
      const sw = document.createElement("div");
      sw.className = "legend-swatch";
      sw.style.background = ARC_COLORS[i];
      item.appendChild(sw);
      item.appendChild(document.createTextNode(`${i} ${ARC_NAMES[i]}`));
      legend.appendChild(item);
    }
  }
}

function toggleAnswers() {
  if (!puzzleData || !puzzleData.maskedSet.size) return;
  answersShown = !answersShown;
  renderPuzzle();
  if (answersShown) loadCelebrationGif();
  else hideCelebrationGif();
}

// ── Loading puzzles ──
function showError(msg) {
  const e = document.getElementById("error-msg");
  e.style.display = "block";
  e.textContent = msg;
}
function clearError() { document.getElementById("error-msg").style.display = "none"; }

function loadEmbedded(key) {
  clearError();
  puzzleData = normalizePuzzle(EMBEDDED_PUZZLES[key]);
  answersShown = false;
  hideCelebrationGif();
  renderPuzzle();
}

function loadCustomJSON(text) {
  clearError();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { showError("Invalid JSON: " + e.message); return; }
  try {
    puzzleData = normalizePuzzle(data);
    answersShown = false;
    hideCelebrationGif();
    renderPuzzle();
  } catch (e) { showError(e.message); }
}

function setPuzzlePicker(key) {
  state.puzzleKey = key; save();
  document.getElementById("custom-panel").style.display = key === "custom" ? "" : "none";
  if (key === "custom") {
    if (state.customJson) {
      document.getElementById("json-input").value = state.customJson;
      loadCustomJSON(state.customJson);
    } else {
      clearError();
      puzzleData = null;
      document.getElementById("sequence-row").innerHTML = "";
      document.getElementById("ph-title").textContent = "";
      document.getElementById("ph-sub").textContent = "";
      document.getElementById("narrative-text").textContent = "Paste or upload a puzzle above to get started.";
      document.getElementById("reveal-btn").style.display = "none";
      document.getElementById("masked-count").textContent = "";
    }
  } else {
    loadEmbedded(key);
  }
}

// ── Meme banners — no network calls, no keys, just emoji + a punchy caption ──
const MOOD_MEMES = [
  { emoji: "🔨", caption: "clean spin, clean hit" },
  { emoji: "🐢👻", caption: "the tortoise never forgets" },
  { emoji: "🍜", caption: "same order energy" },
  { emoji: "🤯", caption: "wait, what just happened" },
  { emoji: "🌀", caption: "plot twist incoming" },
  { emoji: "😬", caption: "this is fine" },
  { emoji: "🕵️", caption: "detective mode: on" },
  { emoji: "🧠", caption: "big brain puzzle time" },
];
const CELEBRATE_MEMES = [
  { emoji: "🎉", caption: "nailed it" },
  { emoji: "🥁", caption: "ta-da!" },
  { emoji: "💃", caption: "victory dance" },
  { emoji: "🙌", caption: "hell yeah" },
  { emoji: "🏆", caption: "Nice!" },
];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function loadMoodGif() {
  const wrap = document.getElementById("mood-wrap");
  if (!state.memesEnabled) { wrap.style.display = "none"; return; }
  const m = pick(MOOD_MEMES);
  document.getElementById("mood-emoji").textContent = m.emoji;
  document.getElementById("mood-caption").textContent = m.caption;
  wrap.style.display = "flex";
}
function loadCelebrationGif() {
  if (!state.memesEnabled) return;
  const m = pick(CELEBRATE_MEMES);
  document.getElementById("celebrate-emoji").textContent = m.emoji;
  document.getElementById("celebrate-caption").textContent = m.caption;
  document.getElementById("celebrate-card").classList.add("show");
}
function hideCelebrationGif() {
  document.getElementById("celebrate-card").classList.remove("show");
}
function refreshGifVisibility() {
  if (!state.memesEnabled) {
    document.getElementById("mood-wrap").style.display = "none";
    hideCelebrationGif();
  } else {
    loadMoodGif();
  }
}

// ── Theme ──
function applyTheme(t) {
  if (t === "light") document.documentElement.dataset.theme = "light";
  else delete document.documentElement.dataset.theme;
  const moon = document.getElementById("icon-moon"), sun = document.getElementById("icon-sun");
  moon.style.display = t === "light" ? "none" : "";
  sun.style.display = t === "light" ? "" : "none";
  try { localStorage.setItem("narc-visualizer-theme", t); } catch (e) {}
}
document.getElementById("theme-toggle").onclick = () => {
  const current = document.documentElement.dataset.theme === "light" ? "light" : "dark";
  applyTheme(current === "light" ? "dark" : "light");
};

// ── Wire up controls ──
document.getElementById("puzzle-picker").onchange = e => setPuzzlePicker(e.target.value);
document.getElementById("reveal-btn").onclick = toggleAnswers;
document.getElementById("mood-reroll").onclick = loadMoodGif;

document.getElementById("load-custom-btn").onclick = () => {
  const txt = document.getElementById("json-input").value.trim();
  if (!txt) { showError("Paste a NARC JSON first."); return; }
  state.customJson = txt; save();
  loadCustomJSON(txt);
};
document.getElementById("upload-btn").onclick = () => document.getElementById("json-file").click();
document.getElementById("json-file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    document.getElementById("json-input").value = rd.result;
    state.customJson = rd.result; save();
    loadCustomJSON(rd.result);
  };
  rd.readAsText(f);
};
document.addEventListener("dragover", e => {
  if (state.puzzleKey !== "custom") return;
  e.preventDefault();
  document.getElementById("custom-panel").classList.add("drag-over");
});
document.addEventListener("dragleave", () => document.getElementById("custom-panel").classList.remove("drag-over"));
document.addEventListener("drop", e => {
  if (state.puzzleKey !== "custom") return;
  e.preventDefault();
  document.getElementById("custom-panel").classList.remove("drag-over");
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = ev => {
    document.getElementById("json-input").value = ev.target.result;
    state.customJson = ev.target.result; save();
    loadCustomJSON(ev.target.result);
  };
  rd.readAsText(file);
});

function bindToggle(id, key) {
  document.getElementById(id).onchange = e => {
    state[key] = e.target.checked; save();
    renderPuzzle();
  };
}
bindToggle("show-numbers", "showNumbers");
bindToggle("show-grid", "showGrid");
bindToggle("show-legend", "showLegend");
document.getElementById("memes-enabled").onchange = e => {
  state.memesEnabled = e.target.checked; save();
  refreshGifVisibility();
};
document.getElementById("cell-size").oninput = e => {
  state.cellSize = +e.target.value; save();
  document.getElementById("cell-size-v").textContent = e.target.value + "px";
  renderPuzzle();
};

// ── Init ──
load();
applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");
document.getElementById("puzzle-picker").value = state.puzzleKey;
document.getElementById("cell-size").value = state.cellSize;
document.getElementById("cell-size-v").textContent = state.cellSize + "px";
document.getElementById("show-numbers").checked = state.showNumbers;
document.getElementById("show-grid").checked = state.showGrid;
document.getElementById("show-legend").checked = state.showLegend;
document.getElementById("memes-enabled").checked = state.memesEnabled;
setPuzzlePicker(state.puzzleKey);
if (state.memesEnabled) loadMoodGif();
</script>
</body>
</html>
